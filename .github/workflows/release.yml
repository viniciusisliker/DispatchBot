# Gera o instalador numa máquina Windows do GitHub e publica a Release.
# Dispara ao enviar uma tag v<versão> (ex.: v1.10.5) ou à mão (Actions → Release → Run workflow).
# A versão vem de robo/versao.py; as notas vêm de build/notas/<versão>.md (sem o arquivo: notas automáticas).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (PyInstaller + Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          powershell -ExecutionPolicy Bypass -File build\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "Falha no build" }

      - name: Gerar os PDFs (manual e documentação técnica) com o Edge
        # Os PDFs anexados à Release saem sempre do HTML da própria versão (fonte Segoe UI do Windows)
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
          foreach ($par in @(@("docs\manual\manual.html", "docs\manual\Manual-DispatchBot.pdf"), @("docs\tecnico\documentacao-tecnica.html", "docs\tecnico\DispatchBot-Documentacao-Tecnica.pdf"))) {
            $fonte = (Resolve-Path $par[0]).Path
            $pdf = Join-Path (Get-Location) $par[1]
            $antes = if (Test-Path $pdf) { (Get-Item $pdf).LastWriteTime } else { [datetime]::MinValue }
            Start-Process -FilePath $edge -Wait -ArgumentList @("--headless=new", "--disable-gpu", "--no-pdf-header-footer", "--print-to-pdf=`"$pdf`"", "`"file:///$($fonte -replace '\\','/')`"")
            if (-not (Test-Path $pdf) -or (Get-Item $pdf).LastWriteTime -le $antes) { Write-Warning "PDF não gerado, vai o do repositório: $pdf"; continue }
            Write-Host "PDF gerado: $pdf"
          }

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versao = (python -c "import sys; sys.path.insert(0, 'robo'); from versao import VERSAO; print(VERSAO)").Trim()
          $exe = "dist\instalador\DispatchBot-Setup-$versao.exe"
          if (-not (Test-Path $exe)) { throw "Instalador não encontrado: $exe" }
          $anexos = @($exe)
          foreach ($pdf in @("docs\manual\Manual-DispatchBot.pdf", "docs\tecnico\DispatchBot-Documentacao-Tecnica.pdf")) {
            if (Test-Path $pdf) { $anexos += $pdf } else { Write-Warning "PDF não encontrado: $pdf" }
          }
          gh release view "v$versao" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$versao" @anexos --clobber
          } else {
            $notas = "build\notas\$versao.md"
            if (Test-Path $notas) {
              gh release create "v$versao" @anexos --target $env:GITHUB_SHA --title "DispatchBot $versao" --notes-file $notas
            } else {
              gh release create "v$versao" @anexos --target $env:GITHUB_SHA --title "DispatchBot $versao" --generate-notes
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a Release" }
